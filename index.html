<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glosario de Mutaciones - The Isle EVRIMA</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #111827;
            --card-border: #1f293d;
            --accent-color: #06b6d4;
            --accent-hover: #0891b2;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --badge-carni: #ef4444;
            --badge-herbi: #22c55e;
            --badge-ambos: #3b82f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 2rem;
            line-height: 1.5;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        header p {
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Paneles de Filtro */
        .controls-container {
            max-width: 1100px;
            margin: 0 auto 2rem auto;
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 1rem 1.5rem;
            border-radius: 12px;
            border: 1px solid var(--card-border);
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        label {
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        select, input[type="text"] {
            background: #1e293b;
            color: var(--text-main);
            border: 1px solid var(--card-border);
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus, input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        input[type="text"] {
            min-width: 250px;
        }

        /* Grid de Tarjetas */
        .grid-container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1.2rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.8rem;
            gap: 0.5rem;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
        }

        .card-value {
            background: rgba(6, 182, 212, 0.15);
            color: var(--accent-color);
            padding: 0.2rem 0.6rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .card-body {
            font-size: 0.92rem;
            color: #cbd5e1;
            margin-bottom: 1rem;
        }

        .card-footer {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            border-top: 1px solid var(--card-border);
            padding-top: 0.8rem;
        }

        .badge {
            font-size: 0.75rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-herbi { background: rgba(34, 197, 94, 0.15); color: var(--badge-herbi); }
        .badge-carni { background: rgba(239, 68, 68, 0.15); color: var(--badge-carni); }
        .badge-ambos { background: rgba(59, 130, 246, 0.15); color: var(--badge-ambos); }
        .badge-slot { background: #334155; color: #f1f5f9; }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Glosario de Mutaciones</h1>
        <p>Verificación in-game de valores y descripciones reales de The Isle EVRIMA</p>
    </header>

    <div class="controls-container">
        <div class="filter-group">
            <label for="dietaSelect">Dieta:</label>
            <select id="dietaSelect">
                <option value="todos">Todas</option>
                <option value="herbi">Herbívoro (Maiasaura)</option>
                <option value="carni">Carnívoro</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="faseSelect">Fase / Slot:</label>
            <select id="faseSelect">
                <option value="todas">Todas las Fases</option>
                <option value="1">Fase 1 (Slot 1)</option>
                <option value="2">Fase 2 (Slot 2)</option>
                <option value="3">Fase 3 (Slot 3)</option>
            </select>
        </div>

        <div class="filter-group">
            <input type="text" id="searchInput" placeholder="Buscar por nombre o efecto...">
        </div>
    </div>

    <div class="grid-container" id="mutationsGrid">
        <!-- Se genera dinámicamente con JS -->
    </div>

    <script>
        // Base de Datos Verificada In-Game
        const mutacionesDB = [
            // UNIVERSALES / COMPARTIDAS
            { nombre: "Cellular Regeneration", valor: "10%", desc: "Recupera salud ligeramente más rápido.", dieta: "ambos", fases: [1, 2, 3] },
            { nombre: "Advanced Gestation", valor: "50%", desc: "Acelera el tiempo de gestación, incubación y cooldown de huevos.", dieta: "ambos", fases: [1, 2, 3] },
            { nombre: "Sustained Hydration", valor: "20%", desc: "El agua se consume más lentamente.", dieta: "ambos", fases: [1, 2, 3] },
            { nombre: "Enlarged meniscus", valor: "Especial", desc: "El daño por caída consume estamina antes que vida.", dieta: "ambos", fases: [1, 2, 3] },
            { nombre: "Efficient Digestion", valor: "20%", desc: "La comida se consume más lentamente.", dieta: "ambos", fases: [1, 2, 3] },
            { nombre: "Featherweight", valor: "15%", desc: "Las huellas desaparecen mucho más rápido.", dieta: "ambos", fases: [1, 2, 3] },
            { nombre: "Wader", valor: "25%", desc: "Menos penalización al caminar por aguas poco profundas.", dieta: "ambos", fases: [1, 2, 3] },
            { nombre: "Epidermal Fibrosis", valor: "15%", desc: "Aumenta la resistencia al sangrado.", dieta: "ambos", fases: [1, 2, 3] },
            { nombre: "Congenital Hypoalgesia", valor: "15%", desc: "Reduce el daño recibido al pelear contra especies más grandes.", dieta: "ambos", fases: [1, 2, 3] },
            { nombre: "Photosynthetic Tissue", valor: "5%", desc: "Recuperación de vida/vida bloqueada más rápida de día.", dieta: "ambos", fases: [1, 2, 3] },
            { nombre: "Nocturnal", valor: "5%", desc: "Recuperación de vida/vida bloqueada más rápida de noche.", dieta: "ambos", fases: [1, 2, 3] },
            { nombre: "Hydroregenerative", valor: "25%", desc: "Recupera salud más rápido durante la lluvia.", dieta: "ambos", fases: [1, 2, 3] },
            { nombre: "Increased Inspiratory Capacity", valor: "15%", desc: "Mayor capacidad de oxígeno.", dieta: "ambos", fases: [1, 2, 3] },
            { nombre: "Hydrodynamic", valor: "15%", desc: "Aumenta la velocidad de nado.", dieta: "ambos", fases: [1, 2, 3] },
            { nombre: "Submerged Optical Retention", valor: "5%", desc: "Aumenta el rango de visión bajo el agua.", dieta: "ambos", fases: [1, 2, 3] },
            { nombre: "Reabsorption", valor: "1", desc: "Recupera una pequeña cantidad de agua durante la lluvia o al nadar en agua potable.", dieta: "ambos", fases: [1, 2, 3] },
            { nombre: "Infrasound Communication", valor: "50%", desc: "Hace significativamente menos ruido al hablar en el chat.", dieta: "ambos", fases: [1, 2, 3] },
            { nombre: "Sequential Hermaphroditism", valor: "Especial", desc: "Cambia el sexo de tu personaje. No se hereda a las crías.", dieta: "ambos", fases: [1, 2, 3] },
            { nombre: "Osteosclerosis", valor: "20%", desc: "Resistencia o reducción de daño por fracturas.", dieta: "ambos", fases: [1, 2, 3] },

            // EXCLUSIVAS HERBÍVOROS
            { nombre: "Photosynthetic Regeneration", valor: "10%", desc: "Regenera estamina más rápido durante el día.", dieta: "herbi", fases: [1, 2, 3] },
            { nombre: "Truculency", valor: "5% / 50%", desc: "Mayor probabilidad de desmontar animales enganchados al sacudirse (bucking).", dieta: "herbi", fases: [1, 3] },
            { nombre: "Xerocole Adaptation", valor: "15%", desc: "Gana algo de agua al comer plantas.", dieta: "herbi", fases: [3] },
            { nombre: "Barometric Sensitivity", valor: "Especial", desc: "Recibe una indicación antes de tormentas o sequías.", dieta: "herbi", fases: [2] },
            { nombre: "Social Behavior", valor: "1.5", desc: "Aumenta el tamaño de grupo. Solo aplica al líder.", dieta: "herbi", fases: [2] },
            { nombre: "Tactile Endurance", valor: "25%", desc: "Convierte el daño recibido en estamina.", dieta: "herbi", fases: [2] },
            { nombre: "Gastronomic Regeneration", valor: "5%", desc: "Comer restaura una pequeña cantidad de salud.", dieta: "herbi", fases: [2] },
            { nombre: "Prolific Reproduction", valor: "10%", desc: "Crías con más regeneración de vida/estamina, consumen menos comida y crecen más rápido.", dieta: "herbi", fases: [2] },
            { nombre: "Parthenogenesis", valor: "Especial", desc: "Permite al jugador anidar sin necesidad de una pareja.", dieta: "herbi", fases: [2] },
            { nombre: "Hypervigilance", valor: "50%", desc: "Aumenta el ángulo de cámara al comer/beber y el audio de pisadas ajenas.", dieta: "herbi", fases: [3] },

            // EXCLUSIVAS CARNÍVOROS
            { nombre: "Hemomania", valor: "5%", desc: "Hace daño extra a un objetivo que esté sangrando.", dieta: "carni", fases: [1] },
            { nombre: "Hematophagy", valor: "15%", desc: "Recupera algo de sed al comer carne.", dieta: "carni", fases: [1] },
            { nombre: "Accelerated Prey Drive", valor: "10%", desc: "Inflige más daño a animales con poca salud.", dieta: "carni", fases: [1] }
        ];

        // Elementos DOM
        const grid = document.getElementById('mutationsGrid');
        const dietaSelect = document.getElementById('dietaSelect');
        const faseSelect = document.getElementById('faseSelect');
        const searchInput = document.getElementById('searchInput');

        // Función de Renderizado
        function renderMutations() {
            const dietaVal = dietaSelect.value;
            const faseVal = faseSelect.value;
            const searchVal = searchInput.value.toLowerCase().trim();

            const filtradas = mutacionesDB.filter(m => {
                // Filtro por Dieta
                const matchDieta = (dietaVal === 'todos') || (m.dieta === 'ambos') || (m.dieta === dietaVal);
                
                // Filtro por Fase
                const matchFase = (faseVal === 'todas') || m.fases.includes(parseInt(faseVal));

                // Filtro por Búsqueda
                const matchSearch = m.nombre.toLowerCase().includes(searchVal) || m.desc.toLowerCase().includes(searchVal);

                return matchDieta && matchFase && matchSearch;
            });

            grid.innerHTML = '';

            if (filtradas.length === 0) {
                grid.innerHTML = '<div class="no-results">No se encontraron mutaciones con los filtros seleccionados.</div>';
                return;
            }

            filtradas.forEach(m => {
                const card = document.createElement('div');
                card.className = 'card';

                let dietaBadgeClass = m.dieta === 'herbi' ? 'badge-herbi' : (m.dieta === 'carni' ? 'badge-carni' : 'badge-ambos');
                let dietaBadgeText = m.dieta === 'herbi' ? 'Herbívoro' : (m.dieta === 'carni' ? 'Carnívoro' : 'Ambos');

                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <span class="card-title">${m.nombre}</span>
                            <span class="card-value">${m.valor}</span>
                        </div>
                        <div class="card-body">
                            ${m.desc}
                        </div>
                    </div>
                    <div class="card-footer">
                        <span class="badge ${dietaBadgeClass}">${dietaBadgeText}</span>
                        ${m.fases.map(f => `<span class="badge badge-slot">Fase ${f}</span>`).join('')}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Event Listeners
        dietaSelect.addEventListener('change', renderMutations);
        faseSelect.addEventListener('change', renderMutations);
        searchInput.addEventListener('input', renderMutations);

        // Render Inicial
        renderMutations();
    </script>
</body>
</html>
