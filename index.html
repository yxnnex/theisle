<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Isle: Evrima - Build Manager & Mutaciones</title>
    
    <!-- FUENTES DE GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chango&family=Short+Stack&display=swap" rel="stylesheet">

    <!-- TOM SELECT CSS -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.dark.css" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0a0a0a url('theislefondo.jpg') no-repeat center center fixed; 
            background-size: cover;
            color: #ffffff; 
            padding: 20px; 
            max-width: 950px; 
            margin: 0 auto; 
            line-height: 1.5;
            font-size: 14px;
        }

        .top-bar { display: flex; justify-content: flex-end; margin-bottom: 15px; }
        .lang-btn {
            background-color: rgba(30, 32, 35, 0.9);
            color: #ffffff;
            border: 1px solid #ff4d4d;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            backdrop-filter: blur(5px);
        }
        .lang-btn:hover { background-color: #ff4d4d; transform: scale(1.05); }

        .highlight-red { border-bottom: 2px solid #ff4d4d; padding-bottom: 1px; color: #ffffff; font-weight: bold; }

        h1 {
            font-family: 'Chango', cursive;
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 8px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 3px 10px rgba(0,0,0,0.95);
        }

        p.subtitle, p#subtitulo-glosario {
            font-family: 'Short Stack', cursive;
            color: #ffffff;
            margin-bottom: 20px;
            font-size: 0.95rem;
            text-shadow: 0 2px 6px rgba(0,0,0,0.95);
        }
        p.subtitle { text-align: center; }

        label {
            font-family: 'Short Stack', cursive;
            display: block;
            margin-bottom: 6px;
            font-size: 0.95rem;
            color: #ffffff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.9);
        }

        /* CUSTOMIZACIÓN DE TOM SELECT */
        .ts-control {
            background-color: rgba(20, 22, 25, 0.9) !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            border-radius: 8px !important;
            padding: 10px !important;
            color: #ffffff !important;
            font-size: 14px !important;
        }
        .ts-dropdown {
            background-color: #141619 !important;
            border: 1px solid #ff4d4d !important;
            color: #ffffff !important;
            border-radius: 8px !important;
            overflow: hidden;
        }
        .ts-dropdown .option { color: #ffffff !important; padding: 8px 12px; }
        .ts-dropdown .active { background-color: #ff4d4d !important; color: #fff !important; }
        .ts-dropdown .optgroup-header { color: #ff4d4d; font-weight: bold; background: #0d0e10; }

        /* TARJETAS DE BUILD Y GLOSARIO */
        .card, .mutacion-item {
            background: rgba(20, 22, 25, 0.9);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
        }

        .card { padding: 18px; margin-top: 15px; margin-bottom: 25px; border-top: 3px solid #ff4d4d; }
        .card h2 { font-family: 'Short Stack', cursive; font-size: 1.5rem; color: #ffffff; margin-bottom: 8px; }
        .card p { margin-bottom: 12px; color: #e0e0e0; font-size: 0.9rem; }

        ul.build-list { padding: 0; list-style-type: none; }
        ul.build-list li { 
            background: rgba(15, 15, 18, 0.6); 
            padding: 10px 14px; 
            margin-bottom: 8px; 
            border-radius: 6px; 
            border-left: 3px solid #ff4d4d; 
        }

        /* BADGES Y ETIQUETAS */
        .badge-container { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
        .badge {
            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
        }
        .badge-sinergia { background: rgba(46, 204, 113, 0.2); color: #2ecc71; border: 1px solid #2ecc71; }
        .badge-poca { background: rgba(231, 76, 60, 0.2); color: #e74c3c; border: 1px solid #e74c3c; }
        .badge-situacional { background: rgba(241, 196, 15, 0.2); color: #f1c40f; border: 1px solid #f1c40f; }
        .badge-restriction { background: rgba(155, 89, 182, 0.2); color: #9b59b6; border: 1px solid #9b59b6; }

        /* ACORDEÓN DE DESBLOQUEO */
        .unlock-box {
            margin-top: 8px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 77, 77, 0.3);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 0.8rem;
        }
        .unlock-box summary { cursor: pointer; color: #ff4d4d; font-weight: bold; outline: none; }
        .unlock-box summary:hover { color: #ff6666; }
        .unlock-steps { margin-top: 6px; margin-left: 18px; color: #d1d1d1; }

        hr { border: 0; height: 1px; background: rgba(255, 255, 255, 0.2); margin: 30px 0; }

        h2.section-title { font-family: 'Short Stack', cursive; color: #ffffff; margin-bottom: 12px; font-size: 1.6rem; }
        h3 { font-family: 'Short Stack', cursive; color: #ffffff; font-size: 1.25rem; margin: 20px 0 12px 0; border-bottom: 2px solid #ff4d4d; display: inline-block; }

        .grid-mutaciones { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
        .mutacion-item { padding: 12px; border-left: 4px solid #ff4d4d; }
        .mutacion-item strong { color: #ffffff; display: block; font-size: 0.95rem; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="lang-btn" id="lang-toggle" onclick="toggleIdioma()">🌐 Switch to English</button>
    </div>

    <h1>The Isle: Evrima - Build Manager</h1>
    <p class="subtitle" id="txt-subtitulo">Selecciona tu dinosaurio para consultar su build recomendada de <span class="highlight-red">mutaciones</span>.</p>

    <label for="select-dino" id="lbl-select">Buscar o Seleccionar Dinosaurio:</label>
    <select id="select-dino" placeholder="Escribe para buscar..."></select>

    <div id="resultado-build">
        <p style="text-align: center; color: #d1d1d1; margin-top: 20px;" id="txt-placeholder">
            <em>Elige un dinosaurio de la lista para desplegar su build de 4 mutaciones y estrategia.</em>
        </p>
    </div>

    <hr>

    <h2 class="section-title" id="titulo-glosario">Glosario Completo de <span class="highlight-red">Mutaciones</span></h2>
    <p id="subtitulo-glosario">Lista completa para armar y personalizar tu propia build:</p>

    <div id="contenedor-glosario"></div>

    <!-- TOM SELECT JS -->
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>

    <script>
      let idiomaActual = 'es';
      let tomSelectInstance = null;

      // --- BASE DE DATOS ESTRUCTURADA DE MUTACIONES ---
      const mutacionesDB = [
        // SUPERVIVENCIA Y METABOLISMO
        {
          id: "Cellular Regeneration",
          categoria: 1,
          catNombre: { es: "Supervivencia y Metabolismo", en: "Survival & Metabolism" },
          desc: { es: "+15% velocidad de regeneración de salud.", en: "+15% health regeneration speed." },
          restriccion: null,
          sinergia: ["Gastronomic Regeneration", "Hydroregenerative"],
          pocaSinergia: [],
          situacional: ["Combat Builds"],
          unlock: null
        },
        {
          id: "Efficient Digestion",
          categoria: 1,
          catNombre: { es: "Supervivencia y Metabolismo", en: "Survival & Metabolism" },
          desc: { es: "El hambre se reduce más lento.", en: "Hunger drains slower." },
          restriccion: null,
          sinergia: ["Sustained Hydration"],
          pocaSinergia: ["Hypermetabolic Inanition"],
          situacional: ["Viajes largos / Exploración"],
          unlock: null
        },
        {
          id: "Hypermetabolic Inanition",
          categoria: 1,
          catNombre: { es: "Supervivencia y Metabolismo", en: "Survival & Metabolism" },
          desc: { es: "Mientras menos hambre tengas, más daño infligís (Valor: 15%).", en: "The less hunger you have, the more damage you deal. Value: 15%" },
          restriccion: { es: "🔒 Única de Slot 2", en: "🔒 Slot 2 Unique" },
          sinergia: ["Accelerated Prey Drive", "Hemomania"],
          pocaSinergia: ["Efficient Digestion"],
          situacional: ["PvP Agresivo"],
          unlock: null
        },
        {
          id: "Reniculate Kidneys",
          categoria: 1,
          catNombre: { es: "Supervivencia y Metabolismo", en: "Survival & Metabolism" },
          desc: { es: "Riñones adaptados para procesar agua salada o contaminada.", en: "Kidneys adapted to process saltwater or contaminated water." },
          restriccion: null,
          sinergia: ["Sustained Hydration"],
          pocaSinergia: [],
          situacional: ["Zonas costeras o pantanos salobres"],
          unlock: {
            es: [
              "Bebé agua salada hasta llenar la barra.",
              "Obtené el estado 'Fluid Deficient'.",
              "Eliminá el estado hidratándote correctamente con agua dulce.",
              "La mutación quedará disponible para equipar."
            ],
            en: [
              "Drink saltwater until the bar fills up.",
              "Obtain the 'Fluid Deficient' status.",
              "Remove the status by properly hydrating with fresh water.",
              "The mutation will become available to equip."
            ]
          }
        },

        // COMBATE Y RESISTENCIA
        {
          id: "Epidermal Fibrosis",
          categoria: 2,
          catNombre: { es: "Combate y Resistencia", en: "Combat & Resistance" },
          desc: { es: "+15% de resistencia al sangrado.", en: "+15% bleed resistance." },
          restriccion: null,
          sinergia: ["Osteosclerosis", "Congenital Hypoalgesia"],
          pocaSinergia: [],
          situacional: ["Contra carnívoros con sangrado (Raptors/Dilo)"],
          unlock: null
        },
        {
          id: "Osteosclerosis",
          categoria: 2,
          catNombre: { es: "Combate y Resistencia", en: "Combat & Resistance" },
          desc: { es: "Reduce/evita el daño por fracturas óseas.", en: "Reduces/prevents bone fracture damage." },
          restriccion: null,
          sinergia: ["Enlarged Meniscus", "Epidermal Fibrosis"],
          pocaSinergia: [],
          situacional: ["Brawlers Apex (Rex/Triceratops)"],
          unlock: null
        },

        // CAZA Y DIETA
        {
          id: "Cannibalistic",
          categoria: 3,
          catNombre: { es: "Caza, Dieta y Ataque", en: "Hunting, Diet & Attack" },
          desc: { es: "Permite alimentarte de tu misma especie sin penalizaciones.", en: "Allows feeding on your own species without sickness penalties." },
          restriccion: { es: "🥩 Solo Carnívoros", en: "🥩 Carnivores Only" },
          sinergia: ["Gastronomic Regeneration"],
          pocaSinergia: [],
          situacional: ["Servidores con superpoblación de la misma especie"],
          unlock: null
        },

        // NIDIFICACIÓN Y REPRODUCCIÓN
        {
          id: "Parthenogenesis",
          categoria: 5,
          catNombre: { es: "Nidificación, Cría y Comunicación", en: "Nesting, Breeding & Communication" },
          desc: { es: "Habilidad de reproducción/puesta de huevos sin necesidad de pareja.", en: "Ability to reproduce/lay eggs without a mate." },
          restriccion: { es: "♀️ Solo Hembras", en: "♀️ Females Only" },
          sinergia: ["Advanced Gestation", "Prolific Reproduction"],
          pocaSinergia: [],
          situacional: ["Jugadores solitarios que quieren crear manada"],
          unlock: null
        }
      ];

      // --- BASE DE DATOS DE DINOSAURIOS ---
      const dinosauriosDB = [
        {
          nombre: "Diabloceratops",
          tipo: { es: "Herbívoro", en: "Herbivore" },
          build: {
            es: { desc: "Tanque defensivo y contraataque brutal con cuernos.", slots: ["Epidermal Fibrosis", "Osteosclerosis", "Hypermetabolic Inanition", "Cellular Regeneration"] },
            en: { desc: "Defensive tank and heavy counter-attacker.", slots: ["Epidermal Fibrosis", "Osteosclerosis", "Hypermetabolic Inanition", "Cellular Regeneration"] }
          }
        },
        {
          nombre: "Triceratops",
          tipo: { es: "Herbívoro", en: "Herbivore" },
          build: {
            es: { desc: "Apex herbívoro: Máximo daño frontal y resistencia al dolor.", slots: ["Epidermal Fibrosis", "Hypermetabolic Inanition", "Osteosclerosis", "Cellular Regeneration"] },
            en: { desc: "Apex herbivore: Maximum frontal damage and pain tolerance.", slots: ["Epidermal Fibrosis", "Hypermetabolic Inanition", "Osteosclerosis", "Cellular Regeneration"] }
          }
        }
      ];

      // --- FUNCIONES RENDERIZADORAS ---

      function renderBadges(mut) {
        let html = '<div class="badge-container">';
        
        if (mut.restriccion) {
          html += `<span class="badge badge-restriction">${mut.restriccion[idiomaActual]}</span>`;
        }
        if (mut.sinergia && mut.sinergia.length > 0) {
          html += `<span class="badge badge-sinergia">🟢 ${idiomaActual === 'es' ? 'Sinergia con' : 'Synergy with'}: ${mut.sinergia.join(', ')}</span>`;
        }
        if (mut.pocaSinergia && mut.pocaSinergia.length > 0) {
          html += `<span class="badge badge-poca">🔴 ${idiomaActual === 'es' ? 'Baja sinergia' : 'Low synergy'}: ${mut.pocaSinergia.join(', ')}</span>`;
        }
        if (mut.situacional && mut.situacional.length > 0) {
          html += `<span class="badge badge-situacional">🟡 ${idiomaActual === 'es' ? 'Situacional' : 'Situational'}: ${mut.situacional.join(', ')}</span>`;
        }

        html += '</div>';
        return html;
      }

      function renderUnlockAccordion(unlockData) {
        if (!unlockData) return '';
        const steps = unlockData[idiomaActual];
        return `
          <details class="unlock-box">
            <summary>🔓 ${idiomaActual === 'es' ? 'Requiere desbloqueo (Cómo obtenerla)' : 'Unlock required (How to get)'}</summary>
            <ol class="unlock-steps">
              ${steps.map(step => `<li>${step}</li>`).join('')}
            </ol>
          </details>
        `;
      }

      function renderGlosario() {
        const container = document.getElementById("contenedor-glosario");
        const categorias = [1, 2, 3, 4, 5];
        let html = '';

        categorias.forEach(catId => {
          const mutsCat = mutacionesDB.filter(m => m.categoria === catId);
          if (mutsCat.length > 0) {
            html += `<h3>${mutsCat[0].catNombre[idiomaActual]}</h3><div class="grid-mutaciones">`;
            mutsCat.forEach(mut => {
              html += `
                <div class="mutacion-item">
                  <strong>${mut.id}</strong>
                  <p style="color: #d1d1d1; font-size: 0.85rem;">${mut.desc[idiomaActual]}</p>
                  ${renderBadges(mut)}
                  ${renderUnlockAccordion(mut.unlock)}
                </div>
              `;
            });
            html += `</div>`;
          }
        });
        container.innerHTML = html;
      }

      function mostrarBuild() {
        const select = document.getElementById("select-dino");
        const valorSeleccionado = select.value;
        const contenedor = document.getElementById("resultado-build");

        if (!valorSeleccionado) {
            contenedor.innerHTML = `<p style="text-align: center; color: #d1d1d1; margin-top:20px;"><em>${
                idiomaActual === 'es' 
                ? 'Elige un dinosaurio de la lista para desplegar su build de 4 mutaciones y estrategia.' 
                : 'Choose a dinosaur from the list to display its 4-mutation build and strategy.'
            }</em></p>`;
            return;
        }

        const dinoEncontrado = dinosauriosDB.find(d => d.nombre === valorSeleccionado);

        if (dinoEncontrado) {
            const info = dinoEncontrado.build[idiomaActual];
            const tipoDino = dinoEncontrado.tipo[idiomaActual];
            
            let listHtml = '<ul class="build-list">';
            info.slots.forEach((mutId, index) => {
              const mutData = mutacionesDB.find(m => m.id === mutId);
              const desc = mutData ? mutData.desc[idiomaActual] : '';
              listHtml += `
                <li>
                  <strong style="color: #ff4d4d;">Slot ${index + 1}:</strong> <span style="font-weight:bold; color:#fff;">${mutId}</span>
                  <div style="font-size: 0.85rem; color: #b0b0b0; margin-top:2px;"><em>${desc}</em></div>
                  ${mutData ? renderBadges(mutData) : ''}
                  ${mutData ? renderUnlockAccordion(mutData.unlock) : ''}
                </li>
              `;
            });
            listHtml += '</ul>';

            contenedor.innerHTML = `
              <div class="card">
                <h2>${dinoEncontrado.nombre} <small style="font-size: 13px; color: #ff4d4d;">(${tipoDino})</small></h2>
                <p><strong>${idiomaActual === 'es' ? 'Estrategia principal:' : 'Main strategy:'}</strong> ${info.desc}</p>
                ${listHtml}
              </div>
            `;
        }
      }

      function inicializarTomSelect() {
        if (tomSelectInstance) tomSelectInstance.destroy();

        const selectEl = document.getElementById("select-dino");
        selectEl.innerHTML = '<option value="">-- ' + (idiomaActual === 'es' ? 'Elige o busca un dino' : 'Choose or search a dino') + ' --</option>';

        dinosauriosDB.forEach(dino => {
          const opt = document.createElement("option");
          opt.value = dino.nombre;
          opt.textContent = dino.nombre;
          selectEl.appendChild(opt);
        });

        tomSelectInstance = new TomSelect("#select-dino", {
          create: false,
          sortField: { field: "text", direction: "asc" },
          onChange: function() { mostrarBuild(); }
        });
      }

      function toggleIdioma() {
        idiomaActual = (idiomaActual === 'es') ? 'en' : 'es';
        document.getElementById("lang-toggle").innerText = idiomaActual === 'es' ? "🌐 Switch to English" : "🌐 Cambiar a Español";
        document.getElementById("txt-subtitulo").innerHTML = idiomaActual === 'es' 
          ? 'Selecciona tu dinosaurio para consultar su build recomendada de <span class="highlight-red">mutaciones</span>.'
          : 'Select your dinosaur to check its recommended <span class="highlight-red">mutation</span> build.';
        
        renderGlosario();
        inicializarTomSelect();
        mostrarBuild();
      }

      // --- INICIALIZACIÓN ---
      renderGlosario();
      inicializarTomSelect();
    </script>
</body>
</html>
